<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central Operacional 6D | ADL</title><style>:root{font-family:system-ui;color:#eaf2ff;background:#0b1221}*{box-sizing:border-box}body{max-width:1000px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{margin-bottom:4px}.muted{color:#a9bad1}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;margin-top:20px}.card{background:#17243a;border:1px solid #334b6a;border-radius:14px;padding:18px}a{color:#90c9ff}strong{display:block;margin:9px 0}.tag{font-size:12px;background:#254363;padding:5px 10px;border-radius:30px}button{padding:10px 15px;background:#82baff;border:0;border-radius:8px;font-weight:700;cursor:pointer}footer{margin-top:25px}.error{color:#ffb7b7}</style></head><body><header><div><h1>Central Operacional 6D</h1><div class="muted">Painel de acompanhamento dos projetos ADL</div></div><button id="refresh">Atualizar dados</button></header><p id="status" role="status">Carregando estado registrado no GitHub...</p><main id="projects"></main><footer><p class="muted">Dados provenientes do arquivo de estado versionado. Este painel não executa tarefas nem altera repositórios automaticamente. Nenhuma contratação é autorizada.</p><a href="index.html">Voltar ao ADL Auto</a></footer><script>
const projects=document.querySelector('#projects'),status=document.querySelector('#status');
const url='./data/estado-operacional.json';
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){status.textContent='Consultando o estado operacional...';try{const response=await fetch(url+'?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(data.schema_version!==1||!Array.isArray(data.projects))throw Error('Formato inválido');projects.replaceChildren();for(const p of data.projects){const article=document.createElement('article');article.className='card';const title=document.createElement('h2');title.textContent=p.id;const tag=document.createElement('span');tag.className='tag';tag.textContent=p.status;const next=document.createElement('p');next.textContent='Próxima ação: '+p.next;const link=document.createElement('a');link.href='https://github.com/'+p.repository;link.textContent='Abrir repositório';link.target='_blank';link.rel='noopener noreferrer';article.append(title,tag,next,link);projects.append(article)}status.textContent='Atualizado em '+data.updated_at+' • Limite de custo incremental: R$ '+Number(data.budget_brl_incremental).toFixed(2).replace('.',',')}catch(e){status.textContent='Não foi possível carregar o estado: '+e.message;status.className='error';}}document.querySelector('#refresh').addEventListener('click',load);load();</script></body></html>
